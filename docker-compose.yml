# Local stack. vLLM runs separately (GPU server); point LLM_BASE_URL at it in .env.
# Secrets come from .env (copy .env.example); nothing secret is committed here.
x-app: &app
  build: .
  env_file: .env
  environment:
    # DB_NAME in .env picks the databases: `syllabus` (demo, the default) or e.g. `syllabus_real` for imported
    # real data. Both live side by side; the migrate service creates a missing one.
    DATABASE_URL: postgresql+asyncpg://syllabus:syllabus@postgres:5432/${DB_NAME:-syllabus}
    MONGO_URL: mongodb://mongo:27017
    MONGO_DB: ${DB_NAME:-syllabus}
    REDIS_URL: redis://redis:6379/0
    FILES_ROOT: /data/files
    TMP_ROOT: /data/tmp
    # The Google key uploaded on the Schools & Drive screen; /data is shared by api, worker and beat.
    SECRETS_ROOT: /data/secrets
    # /drive-local is ./drive-local on your machine, read-only: a downloaded copy of the Drive folder for
    # DRIVE_PROVIDER=stub. Set DRIVE_STUB_ROOT_IN_DOCKER=/drive-local in .env to import from it.
    DRIVE_STUB_ROOT: ${DRIVE_STUB_ROOT_IN_DOCKER:-/data/drive}
  volumes:
    - files:/data
    - ./drive-local:/drive-local:ro
    # For DRIVE_PROVIDER=google: GOOGLE_CREDENTIALS_FILE=/secrets/<file>.json
    - ./secrets:/secrets:ro
  depends_on:
    postgres: { condition: service_healthy }
    mongo: { condition: service_healthy }
    redis: { condition: service_healthy }
  extra_hosts:
    - "host.docker.internal:host-gateway"

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: syllabus
      POSTGRES_PASSWORD: syllabus
      POSTGRES_DB: syllabus
    ports: ["5432:5432"]
    volumes: [pg:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U syllabus"]
      interval: 3s
      retries: 20

  mongo:
    image: mongo:7
    ports: ["27017:27017"]
    volumes: [mongo:/data/db]
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      retries: 20

  migrate:
    <<: *app
    # bootstrap --if-enabled: Schools, rubric and test users when SEED_TEST_USERS=true in .env (idempotent).
    command: ["sh", "-c", "python -m app.cli create-db && alembic upgrade head && python -m app.cli bootstrap --if-enabled"]
    restart: "no"

  api:
    <<: *app
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8080"]
    ports: ["8080:8080"]
    depends_on:
      migrate: { condition: service_completed_successfully }

  worker:
    <<: *app
    # Keep -c for the ai queue in line with LLM_MAX_CONCURRENCY and what the vLLM server can take.
    command: ["celery", "-A", "app.workers.celery_app", "worker", "-Q", "ai,default", "-c", "2", "--loglevel", "info"]
    depends_on:
      migrate: { condition: service_completed_successfully }

  beat:
    <<: *app
    command: ["celery", "-A", "app.workers.celery_app", "beat", "--loglevel", "info", "-s", "/data/celerybeat-schedule"]
    depends_on:
      migrate: { condition: service_completed_successfully }

volumes:
  pg:
  mongo:
  files:
